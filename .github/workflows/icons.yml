name: Build Castle Crash icons
on:
  push:
    branches: [main]
    paths: ['castle-crash/icons/*.b64', '.github/workflows/icons.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for f in castle-crash/icons/*.png.b64; do base64 -d "$f" > "${f%.b64}"; done
          git config user.name "castle-crash-bot"
          git config user.email "castle-crash-bot@users.noreply.github.com"
          git add castle-crash/icons/*.png
          git diff --cached --quiet || (git commit -m "Build PNG icons" && git push)
