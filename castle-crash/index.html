<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Castle Crash">
<meta name="theme-color" content="#1d2b53">
<meta name="description" content="Castle Crash: aim, fire, and topple the castle. A physics puzzle game.">
<title>Castle Crash</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="safe-probe"></div>
<canvas id="game"></canvas>

<div id="hud" class="hidden">
  <button id="btn-menu" class="hbtn" aria-label="Levels">&#9776;</button>
  <div id="hud-mid">
    <div id="hud-level">Level 1</div>
    <div id="hud-balls"></div>
  </div>
  <button id="btn-restart" class="hbtn" aria-label="Restart">&#8635;</button>
  <button id="btn-sound" class="hbtn" aria-label="Sound">&#128266;</button>
</div>
<div id="hint" class="hidden">Drag back from the cannon to aim, release to fire</div>

<div id="title" class="screen">
  <div class="logo"><span>CASTLE</span><span>CRASH</span></div>
  <div class="tag">Topple the towers. Claim the crowns.</div>
  <button id="btn-play" class="big">Play</button>
  <button id="btn-levels" class="big alt">Levels</button>
  <div class="coins-line">&#129689; <span class="coins">0</span></div>
</div>

<div id="levels" class="screen hidden">
  <div class="lv-head">
    <button id="btn-back" class="hbtn" aria-label="Back">&#8592;</button>
    <div class="lv-title">Choose a Level</div>
    <div class="lv-coins">&#129689; <span class="coins">0</span></div>
  </div>
  <div class="lv-stars">&#9733; <span id="star-total">0</span></div>
  <div id="lv-grid"></div>
</div>

<div id="result" class="screen dim hidden">
  <div class="card">
    <div id="res-title">Castle Cleared!</div>
    <div id="res-stars"><span>&#9733;</span><span>&#9733;</span><span>&#9733;</span></div>
    <div id="res-score"></div>
    <div id="res-coins"></div>
    <div class="row">
      <button id="res-levels" class="mid alt" aria-label="Levels">&#9776;</button>
      <button id="res-retry" class="mid alt" aria-label="Retry">&#8635;</button>
      <button id="res-next" class="mid">Next &#9654;</button>
    </div>
  </div>
</div>

<script src="js/matter.min.js"></script>
<script src="js/core.js"></script>
<script src="js/levels.js"></script>
<script src="js/game.js"></script>
</body>
</html>
